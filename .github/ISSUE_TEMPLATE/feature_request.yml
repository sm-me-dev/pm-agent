name: Feature Request
description: Suggest an idea for pm-agent
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for suggesting a feature.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or gap are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should pm-agent behave?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workarounds or alternative approaches you've tried.

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Links, mockups, or references that help explain the request.
