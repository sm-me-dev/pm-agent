[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-agent"
version = "0.3.0"
description = "Stateful Technical PM Agent — multi-project CLI with persistent per-project context"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "sm-me-uwe" }]
keywords = ["ai", "agent", "pm", "orchestrator", "llm", "project-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Environment :: Console",
]
dependencies = [
    "openai>=1.60.0",
    "prompt-toolkit>=3.0.48",
    "rich>=13.7.0",
]

[project.urls]
Homepage = "https://github.com/sm-me-dev/pm-agent"
Source = "https://github.com/sm-me-dev/pm-agent"
Issues = "https://github.com/sm-me-dev/pm-agent/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
]

[project.scripts]
pm-agent = "pm_agent.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pm_agent.prompts" = ["*.md", "*.json"]
"pm_agent.infrastructure.sqlite.schema" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src", "."]
filterwarnings = [
    "error::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
